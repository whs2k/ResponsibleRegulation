name: Daily Regulation Monitor

on:
  schedule:
    - cron: '0 12 * * *' # Run at 12:00 PM UTC every day
  workflow_dispatch: # Allow manual trigger

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pydantic google-genai

      - name: Run regulation monitor
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python main.py --regulation_api_key ${{ secrets.REGULATION_API_KEY }} --gemini_api_key ${{ secrets.GEMINI_API_KEY }}
